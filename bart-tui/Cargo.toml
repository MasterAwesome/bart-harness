[package]
name = "bart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "bart"

[[bin]]
name = "bart"
path = "src/main.rs"
test = false

[[test]]
name = "unit"
path = "tests/unit.rs"

[lints]
workspace = true

[dependencies]
bart-core = { path = "../bart-core" }
base64 = "0.23.1"
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
filedescriptor = "0.8.3"
fuzzy-matcher = "0.3.7"
ignore = "0.4.35"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-crossterm = { version = "0.1.2", features = ["underline-color"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "form", "json"] }
rustix = { version = "1.1.6", features = ["event", "fs", "process", "net", "stdio"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = { version = "0.11.1", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "time", "net", "io-util", "macros", "rt", "signal", "sync"] }
unicase = "2.10.0"
unicode-segmentation = "1.13.3"

[dev-dependencies]
bart-core = { path = "../bart-core", features = ["test-support"] }
tokio = { version = "1.54.1", features = ["test-util"] }
