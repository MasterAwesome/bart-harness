[workspace]
resolver = "3"
members = ["bart-core", "bart-tui"]
default-members = ["bart-core", "bart-tui"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.99.0"
description = "Bart is an agent that likes notebooks!"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MasterAwesome/bart-harness"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.dev]
panic = "abort"

[profile.release]
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = false
