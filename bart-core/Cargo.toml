[package]
name = "bart-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = ["dep:tempfile"]

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "bart-supervisor"
path = "src/bin/bart-supervisor.rs"
test = false

[[test]]
name = "unit"
path = "tests/unit.rs"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
bytes = "1.12.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
http = "1.5.0"
httpdate = "1.0.3"
httparse = "1.10.1"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy"] }
oauth2 = { version = "5.0", default-features = false }
percent-encoding = "2.3.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "form", "json"] }
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "auth"] }
rustix = { version = "1.1.6", features = ["event", "fs", "process", "net", "stdio"] }
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
signal-hook = { version = "0.4.6", default-features = false }
similar = "3.2"
soketto = { version = "0.8.1", features = ["deflate"] }
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1.54.1", features = ["process", "time", "net", "io-util", "macros", "rt", "signal", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = { version = "0.7.20", features = ["compat"] }
uuid = "1.29.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
