name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: cargo test --locked --test terminal -- --ignored
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: cargo test --locked --test unit traceback

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, asset: bart-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, asset: bart-linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: bart-darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: bart-darwin-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - run: cp target/${{ matrix.target }}/release/bart ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deny]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Tag matches the crate version
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - name: Pin the installer to this release
        run: sed "s#^release=.*#release=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME#" .github/install.sh > install.sh
      - run: sha256sum bart-* install.sh > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" bart-* SHA256SUMS install.sh --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
