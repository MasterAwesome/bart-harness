version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    ignore:
      - dependency-name: flate2
        versions: ["1.1.11"]
      - dependency-name: sse-stream
        versions: [">=0.3"]
    schedule:
      interval: weekly
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
