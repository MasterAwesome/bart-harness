version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: sha1
        versions: [">=0.11"]
      - dependency-name: sha2
        versions: [">=0.11"]
      - dependency-name: sse-stream
        versions: [">=0.3"]
      - dependency-name: signal-hook
        versions: [">=0.4"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
