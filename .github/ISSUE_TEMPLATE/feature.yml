name: Feature request
description: Something you would like Bart to do
labels: [C-feature-request]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you have in mind, and where Bart falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: Optional. How you imagine it working.
