[advisories]
yanked = "deny"
ignore = [
    # FIXME: remove once syntect ships without bincode (trishume/syntect#694).
    # This advisory marks bincode as unmaintained. Syntect uses it for built-in grammars.
    { id = "RUSTSEC-2025-0141", reason = "syntect 5 loads its compiled-in syntax dump with bincode 1.3.3" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
